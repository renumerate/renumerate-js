<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Renumerate SDK Test</title>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="/lib/main.ts"></script>
    <script>
        window.RENUMERATE_LOCAL = true;
    </script>

    <div class="container p-4 mx-auto bg-gray-100 rounded-lg flex flex-col gap-8">
      <h1 class="text-3xl font-bold">Vanilla JS SDK Test</h1>

      <div class="bg-white p-4 rounded shadow">
        <h2 class="text-xl font-bold mb-2">Handshake Token</h2>
        <p class="text-sm text-gray-600 mb-2">
          Get a token from <code class="bg-gray-100 px-1 rounded">GET /api/demo/session?subscription_type=test</code>
        </p>
        <input
          type="text"
          id="handshake_token"
          placeholder="Paste handshake token here..."
          class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 mb-2"
        />
        <button
          class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded"
          onclick="initializeSDK()"
        >
          Initialize SDK
        </button>
        <div id="session_status" class="mt-2 text-sm"></div>
      </div>

      <div class="bg-white p-4 rounded shadow">
        <h2 class="text-xl font-bold mb-4">Retention Flow</h2>

        <div class="flex flex-col gap-4">
          <div>
            <h3 class="font-semibold mb-2">showRetentionView()</h3>
            <button
              class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded disabled:opacity-50"
              id="show_retention_btn"
              onclick="showRetention()"
              disabled
            >
              Cancel Subscription
            </button>
          </div>

          <div>
            <h3 class="font-semibold mb-2">mountCancelButton()</h3>
            <div id="cancel_button_container"></div>
          </div>
        </div>
      </div>

      <div class="bg-white p-4 rounded shadow">
        <h2 class="text-xl font-bold mb-4">Subscription Hub</h2>
        <button
          class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded mb-4 disabled:opacity-50"
          id="mount_hub_btn"
          onclick="mountHub()"
          disabled
        >
          Mount Subscription Hub
        </button>
        <div id="subscription_hub" class="min-h-[400px] bg-gray-50 rounded"></div>
      </div>
    </div>

    <script type="module">
      import { Renumerate } from "./lib/main";

      let renumerate = null;
      let currentToken = "";

      window.initializeSDK = async function() {
        const token = document.getElementById('handshake_token').value;
        if (!token) {
          alert('Please enter a handshake token');
          return;
        }

        currentToken = token;
        const statusEl = document.getElementById('session_status');
        statusEl.innerHTML = '<span class="text-yellow-600">Initializing...</span>';

        renumerate = new Renumerate({
          getAuthToken: () => Promise.resolve(currentToken),
          debug: true,
          fallbackEmail: 'support@example.com'
        });

        window.renumerate = renumerate;

        try {
          const session = await renumerate.getSession();
          statusEl.innerHTML = `
            <span class="text-green-600">
              Session: ${session.sessionId}<br/>
              Expires: ${new Date(session.expiresAt * 1000).toLocaleString()}
            </span>
          `;

          // Enable buttons
          document.getElementById('show_retention_btn').disabled = false;
          document.getElementById('mount_hub_btn').disabled = false;

          // Mount cancel button
          renumerate.mountCancelButton('cancel_button_container', {
            classes: 'bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded',
            onComplete: () => console.log('Retention flow completed!'),
            onRetained: () => console.log('Customer was retained!'),
            onCancelled: () => console.log('Customer cancelled!')
          });
        } catch (err) {
          statusEl.innerHTML = `<span class="text-red-600">Error: ${err.message}</span>`;
        }
      }

      window.showRetention = function() {
        if (renumerate) {
          renumerate.showRetentionView(undefined, {
            onComplete: () => console.log('Flow completed'),
            onRetained: () => console.log('Customer retained'),
            onCancelled: () => console.log('Customer cancelled')
          });
        }
      }

      window.mountHub = function() {
        if (renumerate) {
          renumerate.mountSubscriptionHub(
            'subscription_hub',
            'h-[400px] w-full',
            'h-[400px] w-full'
          );
        }
      }
    </script>

    <hr class="my-8" />

    <div id="react-root"></div>
    <script type="module">
      import React from 'https://esm.sh/react@18';
      import ReactDOM from 'https://esm.sh/react-dom@18/client';
      import { RenumerateProvider, CancelButton, SubscriptionHub, useRenumerate, useRenumerateContext } from './dist/react/index.es.js';

      window.React = React;
      window.ReactDOM = ReactDOM;
      window.RenumerateComponents = {
        RenumerateProvider,
        CancelButton,
        SubscriptionHub,
        useRenumerate,
        useRenumerateContext
      };
    </script>
    <script type="module" src="./test.tsx"></script>
  </body>
</html>
